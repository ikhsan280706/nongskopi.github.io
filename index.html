<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NONGSKOPI Kasir POS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-brand-logo">☕</div>
    <h1>NONGSKOPI</h1>
    <p class="subtitle">Sistem Kasir Nongskopi</p>

    <div id="login-error-alert" style="display: none; background-color: rgba(220, 53, 69, 0.1); border: 1px solid var(--danger); color: var(--danger); padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 18px;">
      Username atau password salah!
    </div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input type="password" id="password" class="form-control" placeholder="Masukkan password" required autocomplete="current-password">
          <span class="input-group-icon" id="toggle-password-btn" title="Lihat password">👁️</span>
        </div>
      </div>

      <div class="remember-forgot">
        <label class="remember-checkbox">
          <input type="checkbox" id="remember-me">
          <span>Ingat saya</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-submit">
        Masuk Ke Sistem Kasir
      </button>
    </form>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
